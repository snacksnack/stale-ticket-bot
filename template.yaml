AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  stale-ticket-bot
  Checks for stale Jira tickets and posts a Slack reminder on weekday mornings.

Parameters:
  StaleDays:
    Type: Number
    Description: Number of days without activity before a ticket is considered stale
  JiraBaseUrl:
    Type: String
    Description: Jira instance base URL (e.g. https://your-org.atlassian.net)
  JiraProjectKey:
    Type: String
    Description: Jira project key to query for stale tickets (e.g. RC1)
  AlertEmail:
    Type: String
    Description: Email address for DLQ alarm notifications
  SlackBotTokenSecretName:
    Type: String
    Default: incident-summarizer-slackbot
    Description: >-
      Secrets Manager secret holding the Slack bot token (a raw xoxb- string).
      Shared with the ai-incident-summarizer stack, which owns the Slack app.
      Replaced the bot's own incoming webhook after it was revoked on the
      Slack side and answered 404 for two months (RC1-436).
  SlackChannelId:
    Type: String
    Default: C0AVD000GLA
    Description: Slack channel ID the reminder is posted to (#stale-bot). The bot must be a member.

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        STALE_DAYS: !Ref StaleDays
        JIRA_BASE_URL: !Ref JiraBaseUrl
        JIRA_PROJECT_KEY: !Ref JiraProjectKey
        SLACK_BOT_TOKEN_SECRET_NAME: !Ref SlackBotTokenSecretName
        SLACK_CHANNEL_ID: !Ref SlackChannelId

Resources:

  StaleTicketBotDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: stale-ticket-bot-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  StaleTicketBotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt StaleTicketBotDLQ.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt StaleTicketBotDLQ.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:stale-bot/jira-api-token*
                - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SlackBotTokenSecretName}*
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricData
              Resource: "*"
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt StaleTicketBotFunction.Arn

  WeekdayMorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: stale-ticket-bot-schedule
      Description: Runs at 9AM ET on weekdays; timezone-aware so DST is handled automatically
      ScheduleExpression: cron(0 9 ? * MON-FRI *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt StaleTicketBotFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  # The email subscription only delivers once the address clicks SNS's
  # confirmation mail; an unconfirmed subscription is dropped after three
  # days and CloudFormation never notices. Check with
  # `aws sns get-topic-attributes` (SubscriptionsConfirmed) after a deploy.
  # The incident summarizer also receives these alarms through its
  # account-wide EventBridge rule, independent of this topic (RC1-435).
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: stale-ticket-bot-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: stale-ticket-bot-dlq-depth
      AlarmDescription: Messages in the DLQ indicate Lambda failures
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StaleTicketBotDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: stale-ticket-bot-lambda-errors
      AlarmDescription: Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref StaleTicketBotFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: notBreaching

  LambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: stale-ticket-bot-missing-invocation
      AlarmDescription: Lambda was not invoked in the last 24 hours; schedule may have stopped
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref StaleTicketBotFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      AlarmActions:
        - !Ref AlertsTopic
      TreatMissingData: breaching

Outputs:
  StaleTicketBotFunction:
    Description: Lambda Function ARN
    Value: !GetAtt StaleTicketBotFunction.Arn
  StaleTicketBotDLQ:
    Description: Dead Letter Queue URL
    Value: !Ref StaleTicketBotDLQ
  AlertsTopic:
    Description: SNS Topic ARN for alerts
    Value: !Ref AlertsTopic
  LambdaErrorAlarm:
    Description: CloudWatch Alarm ARN for Lambda errors
    Value: !GetAtt LambdaErrorAlarm.Arn
  LambdaInvocationsAlarm:
    Description: CloudWatch Alarm ARN for missing Lambda invocations
    Value: !GetAtt LambdaInvocationsAlarm.Arn