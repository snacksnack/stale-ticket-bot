name: Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  STACK_NAME: stale-ticket-bot

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 src/

      - name: Test
        run: python -m pytest tests/unit -v --cov=src --cov-report=term-missing

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Build
        run: sam build

      - name: Deploy
        run: >
          sam deploy
          --no-confirm-changeset
          --stack-name ${{ env.STACK_NAME }}
          --region ${{ env.AWS_REGION }}
          --parameter-overrides
          AlertEmail=${{ secrets.ALERT_EMAIL }}
          JiraBaseUrl=${{ secrets.JIRA_BASE_URL }}
          JiraProjectKey=${{ secrets.JIRA_PROJECT_KEY }}
          StaleDays=${{ secrets.STALE_DAYS }}
