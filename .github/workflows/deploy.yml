name: Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  STACK_NAME: stale-ticket-bot

permissions:
  id-token: write
  contents: read
  actions: read   # close_dora_failures.sh lists this workflow's own runs (RC1-464)

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 src/

      - name: Test
        run: python -m pytest tests/unit -v --cov=src --cov-report=term-missing

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2

      - name: Build
        run: sam build

      # DORA needs the deploy's start time; GITHUB_ENV is the only state that
      # survives between steps.
      - name: Record deploy start
        run: echo "DEPLOY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Deploy
        run: >
          sam deploy
          --no-confirm-changeset
          --stack-name ${{ env.STACK_NAME }}
          --region ${{ env.AWS_REGION }}
          --parameter-overrides
          AlertEmail=${{ secrets.ALERT_EMAIL }}
          JiraBaseUrl=${{ secrets.JIRA_BASE_URL }}
          JiraProjectKey=${{ secrets.JIRA_PROJECT_KEY }}
          StaleDays=${{ secrets.STALE_DAYS }}

      # A green `sam deploy` is not proof the function runs. The dry run reads
      # both secrets and runs the real Jira query, then returns before the
      # metric and the Slack post, so the channel hears nothing. Needs
      # lambda:InvokeFunction on the deploy role (RC1-459).
      - name: Gate on a dry run of the function
        id: dry_run_gate
        run: |
          set -euo pipefail
          fn=$(aws cloudformation describe-stack-resource --stack-name ${{ env.STACK_NAME }} \
            --logical-resource-id StaleTicketBotFunction \
            --query StackResourceDetail.PhysicalResourceId --output text)
          err=$(aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --payload '{"dry_run": true}' --query FunctionError --output text dry-run.json)
          cat dry-run.json; echo
          if [ "$err" != "None" ] || ! grep -Eq '"dry_run": ?true' dry-run.json; then
            echo "::error::dry run of $fn failed ($err)"
            exit 1
          fi

      # A failed gate is a change failure — deployed but not serving (RC1-464).
      # Only the gate: a sam deploy failure ships nothing.
      - name: Report change failure to Datadog DORA
        if: failure() && steps.dry_run_gate.outcome == 'failure'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_failure.sh stale-ticket-bot

      - name: Report deploy to Datadog DORA
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: scripts/report_dora_deployment.sh stale-ticket-bot "$DEPLOY_STARTED_AT"

      - name: Close restored DORA change failures
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/close_dora_failures.sh stale-ticket-bot deploy.yml "Gate on a dry run of the function"
